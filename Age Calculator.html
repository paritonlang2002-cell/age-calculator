<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Age Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #ffffff;
        }

        .calculator {
            width: min(100%, 500px);
            padding: 35px 30px;
            background: #171717;
            border: 1px solid #333333;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin-bottom: 10px;
            text-align: center;
            font-size: 30px;
        }

        .subtitle {
            margin-bottom: 30px;
            text-align: center;
            color: #aaaaaa;
            font-size: 15px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #444444;
            border-radius: 9px;
            background: #242424;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #888888;
        }

        .calculate-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #ffffff;
            color: #111111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .calculate-button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .calculate-button:active {
            transform: translateY(0);
        }

        .error {
            min-height: 20px;
            margin-top: 15px;
            text-align: center;
            color: #ff6b6b;
            font-size: 14px;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 25px 15px;
            text-align: center;
            background: #222222;
            border-radius: 12px;
        }

        .result h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .age {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .age-value {
            min-width: 100px;
            padding: 15px 10px;
            background: #2d2d2d;
            border-radius: 10px;
        }

        .age-value strong {
            display: block;
            margin-bottom: 5px;
            font-size: 30px;
        }

        .age-value span {
            color: #aaaaaa;
            font-size: 14px;
        }

        .total-days {
            margin-top: 20px;
            color: #aaaaaa;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .calculator {
                padding: 30px 20px;
            }

            h1 {
                font-size: 26px;
            }

            .age-value {
                min-width: 85px;
            }
        }
    </style>
</head>

<body>

    <main class="calculator">

        <h1>Age Calculator</h1>

        <p class="subtitle">
            Enter your date of birth to calculate your exact age.
        </p>

        <div class="input-group">
            <label for="birthDate">Date of Birth</label>

            <input
                type="date"
                id="birthDate"
            >
        </div>

        <button
            id="calculateButton"
            class="calculate-button"
        >
            Calculate Age
        </button>

        <p id="errorMessage" class="error"></p>

        <section id="result" class="result">

            <h2>Your Age</h2>

            <div class="age">

                <div class="age-value">
                    <strong id="years">0</strong>
                    <span>Years</span>
                </div>

                <div class="age-value">
                    <strong id="months">0</strong>
                    <span>Months</span>
                </div>

                <div class="age-value">
                    <strong id="days">0</strong>
                    <span>Days</span>
                </div>

            </div>

            <p class="total-days">
                Total days lived: <span id="totalDays">0</span>
            </p>

        </section>

    </main>

    <script>
        const birthDateInput =
            document.getElementById("birthDate");

        const calculateButton =
            document.getElementById("calculateButton");

        const errorMessage =
            document.getElementById("errorMessage");

        const result =
            document.getElementById("result");

        const yearsElement =
            document.getElementById("years");

        const monthsElement =
            document.getElementById("months");

        const daysElement =
            document.getElementById("days");

        const totalDaysElement =
            document.getElementById("totalDays");


        function calculateAge() {
            const birthDateValue =
                birthDateInput.value;

            errorMessage.textContent = "";
            result.style.display = "none";

            if (!birthDateValue) {
                errorMessage.textContent =
                    "Please enter your date of birth.";
                return;
            }

            const birthDate =
                new Date(birthDateValue + "T00:00:00");

            const today = new Date();

            const todayDate = new Date(
                today.getFullYear(),
                today.getMonth(),
                today.getDate()
            );

            if (birthDate > todayDate) {
                errorMessage.textContent =
                    "Date of birth cannot be in the future.";
                return;
            }

            let years =
                todayDate.getFullYear() -
                birthDate.getFullYear();

            let months =
                todayDate.getMonth() -
                birthDate.getMonth();

            let days =
                todayDate.getDate() -
                birthDate.getDate();


            if (days < 0) {
                months--;

                const previousMonth =
                    new Date(
                        todayDate.getFullYear(),
                        todayDate.getMonth(),
                        0
                    );

                days +=
                    previousMonth.getDate();
            }


            if (months < 0) {
                years--;
                months += 12;
            }


            const millisecondsPerDay =
                1000 * 60 * 60 * 24;

            const totalDays =
                Math.floor(
                    (todayDate - birthDate) /
                    millisecondsPerDay
                );


            yearsElement.textContent = years;
            monthsElement.textContent = months;
            daysElement.textContent = days;

            totalDaysElement.textContent =
                totalDays.toLocaleString();

            result.style.display = "block";
        }


        calculateButton.addEventListener(
            "click",
            calculateAge
        );
    </script>

</body>

</html>
